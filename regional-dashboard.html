<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AquaCrop Decision Lab - Regional Dashboard</title><style>body{font-family:system-ui;margin:0;background:#f6faf7;color:#12302d}main{max-width:1000px;margin:auto;padding:32px}.card{background:#fff;border:1px solid #dbe5e2;border-radius:16px;padding:22px;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:grid;gap:7px}select{padding:10px;border:1px solid #cbdcd7;border-radius:9px}.status{padding:12px;border-radius:10px;background:#eef7f4}.region-list{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.pill{padding:10px 12px;border:1px solid #dbe5e2;border-radius:10px;font-size:13px}@media(max-width:700px){.grid,.region-list{grid-template-columns:1fr}}</style></head>
<body><main><h1>Regional dashboard</h1><p>Choose any covered region in France, Italy, Portugal, Spain, or Greece. The selection is used as the location input for live weather and ET₀ calculations.</p><section class="card"><div class="grid"><label class="field">Country<select id="country"></select></label><label class="field">Region<select id="region"></select></label></div><p id="status" class="status">Select a region to load live data.</p></section><section class="card"><h2>Available regions</h2><div id="list" class="region-list"></div></section></main><script src="data/dashboard-regions.js"></script><script>const country=document.getElementById('country'),region=document.getElementById('region'),status=document.getElementById('status'),list=document.getElementById('list');const countries=Object.keys(AQUACROP_DASHBOARD_REGIONS);country.innerHTML=countries.map(c=>`<option>${c}</option>`).join('');function renderRegions(){const regs=AQUACROP_DASHBOARD_REGIONS[country.value]||[];region.innerHTML=regs.map(r=>`<option>${r}</option>`).join('');list.innerHTML=regs.map(r=>`<div class="pill">${r}</div>`).join('');loadWeather()}async function loadWeather(){const q=encodeURIComponent(`${region.value}, ${country.value}`);status.textContent='Loading live location and ET₀…';try{const g=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${q}&count=1&language=en&format=json`);const gj=await g.json();if(!gj.results?.length)throw new Error('Location not found');const r=gj.results[0];const w=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${r.latitude}&longitude=${r.longitude}&daily=et0_fao_evapotranspiration,precipitation_sum,temperature_2m_max&forecast_days=7&timezone=auto`);const d=await w.json();const et0=d.daily.et0_fao_evapotranspiration.reduce((a,b)=>a+b,0)/7;status.textContent=`Live data: ${r.name}, ${r.country} · average ET₀ over next 7 days: ${et0.toFixed(1)} mm/day.`}catch(e){status.textContent=`Live data unavailable: ${e.message}`}}country.addEventListener('change',renderRegions);region.addEventListener('change',loadWeather);renderRegions();</script></body></html>
